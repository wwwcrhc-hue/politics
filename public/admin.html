<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>مركز إدارة ساحات سياسية</title>
  <link rel="stylesheet" href="/admin.css?v=7.0-admin">
</head>
<body>
  <aside class="side">
    <div class="logo"><span>س</span><div><b>ساحات سياسية</b><small>مركز الإدارة المستقل</small></div></div>
    <nav>
      <button class="active" data-view="dashboard">نظرة عامة</button>
      <button data-view="sessions">الجلسات المباشرة</button>
      <button data-view="content">المحتوى</button>
      <button data-view="rooms">الغرف</button>
      <button data-view="users">المستخدمون</button>
      <button data-view="reports">البلاغات</button>
      <button data-view="logs">سجل الإجراءات</button>
    </nav>
    <div class="sideBottom"><a href="/">← فتح واجهة المستخدم</a><button id="adminLogout">تسجيل الخروج</button></div>
  </aside>
  <main>
    <header><div><span class="kicker">ADMIN CONTROL CENTER</span><h1 id="pageTitle">نظرة عامة</h1></div><div class="identity"><div><b id="adminName">مدير النظام</b><small>صلاحيات كاملة</small></div><i>AD</i></div></header>
    <div id="access" class="access hidden"><h2>صفحة الإدارة فقط</h2><p>هذه الواجهة منفصلة كليًا عن واجهة المستخدم وتتطلب حساب مدير.</p><a href="/">العودة إلى واجهة المستخدم</a></div>
    <section id="workspace">
      <div id="stats" class="stats"></div>
      <div class="panel">
        <div class="panelHead"><div><span class="eyebrow">مركز التحكم</span><h2 id="viewTitle">حالة المنصة</h2></div><button id="refresh">تحديث</button></div>
        <div id="content" class="content"></div>
      </div>
    </section>
  </main>
  <div id="monitor" class="monitor hidden"><div class="monitorHead"><div><span id="monitorType">مراقبة مباشرة</span><b id="monitorTitle"></b></div><button id="closeMonitor">×</button></div><div id="monitorMedia" class="monitorMedia"></div><div id="monitorParticipants"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/admin.js?v=7.0-admin"></script>
</body>
</html>

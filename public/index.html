<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#0b0d12" name="theme-color"/>
<title>ساحات سياسية</title>
<link href="/style.css?v=6.0-premium" rel="stylesheet"/>
</head>
<body>
<header class="top">
<div class="brand">ساحات سياسية <span>5.1</span></div>
<nav>
<button id="homeBtn">الرئيسية</button>
<button id="loginBtn">دخول</button>
<button class="hidden" id="adminPageBtn">مركز الإدارة</button>


<button class="hidden" id="profileBtn">حسابي</button>
<button class="hidden" id="logoutBtn">خروج</button>
</nav>
</header>
<div class="layout">

<aside class="rooms">
<h3>الساحات السياسية</h3>
<button class="primary hidden" id="newRoomBtn">إنشاء غرفة</button>
<div class="roomForm hidden" id="roomForm">
<input id="roomNameInput" maxlength="60" placeholder="اسم الغرفة"/>
<textarea id="roomDescInput" maxlength="240" placeholder="وصف مختصر للغرفة"></textarea>
<div>
<button class="primary" id="saveRoomBtn">حفظ</button>
<button id="cancelRoomBtn">إلغاء</button>
</div>
</div>
<div id="rooms"></div>
</aside>
<main>


<section class="hero">
<div>
<h1 id="roomTitle">كل الساحات</h1>
<p id="roomDesc">منشورات سياسية، صوت مباشر، صور وفيديو، وبث حي.</p>
</div>
<div class="searchRow">
<input id="searchInput" placeholder="ابحث في المنشورات..."/>
<button id="searchBtn">بحث</button>
<button class="hidden" id="clearSearchBtn">مسح</button>
</div>
</section>

<section class="card hidden" id="composer">
<textarea id="postText" maxlength="4000" placeholder="اكتب رأيك السياسي أو تحليلك..."></textarea>
<div class="uploadRow">
<label class="filePick">📎 صور أو فيديو
          <input accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" id="postMedia" multiple="" type="file"/>
</label>
<span class="muted" id="mediaInfo">حتى 4 ملفات، 200MB للملف</span>
</div>
<div class="mediaPreview" id="mediaPreview"></div>
<div class="composerRow">
<select id="postRoom"></select>
<button class="primary" id="publishBtn">نشر</button>
</div>
</section>
<section id="feed"></section>
</main>
<aside class="chat">
<h3>الدردشة المباشرة</h3>
<div id="chatNotice">اختر ساحة لفتح الدردشة.</div>
<section class="realtimeCard">
<div class="rtTitle">🎙️ الغرفة الصوتية <span id="voiceCount">0</span></div>
<div class="rtActions">
<button id="joinVoiceBtn">دخول صوتي</button>
<button class="hidden" id="muteBtn">كتم الميكروفون</button>
<button class="danger hidden" id="leaveVoiceBtn">خروج</button>
</div>
<div class="muted" id="voiceStatus">غير متصل</div>
<div id="remoteAudios"></div>
</section>
<section class="realtimeCard">
<div class="rtTitle">📺 البث المباشر</div>
<div class="muted" id="liveStatus">لا يوجد بث مباشر الآن</div>
<div class="muted hidden" id="liveRecordStatus">يتم تسجيل البث وحفظه للمراجعة الإدارية.</div>
<div class="rtActions">
<button id="startLiveBtn">ابدأ بث فيديو</button>
<button class="hidden" id="watchLiveBtn">مشاهدة البث</button>
<button class="danger hidden" id="stopLiveBtn">إيقاف البث</button>
<button class="danger hidden" id="forceStopLiveBtn">قطع البث</button>
</div>
<video autoplay="" class="liveVideo hidden" controls="" id="liveVideo" playsinline=""></video>
</section>
<div class="chatBox" id="chatBox"></div>
<div class="chatSend hidden" id="chatSend">
<input id="chatInput" maxlength="1000" placeholder="رسالة إلى الساحة"/>
<button class="primary" id="chatBtn">إرسال</button>
</div>
</aside>
</div>
<div class="modal hidden" id="modal">
<div class="modalCard">
<button class="close" id="closeModal">×</button>
<h2 id="modalTitle">تسجيل الدخول</h2>
<input id="authName" maxlength="24" placeholder="اسم المستخدم"/>
<input class="hidden" id="displayName" maxlength="40" placeholder="الاسم الظاهر"/>
<input id="authPass" maxlength="128" placeholder="كلمة المرور (8 أحرف على الأقل)" type="password"/>
<button class="primary" id="authSubmit">دخول</button>
<button class="link" id="switchAuth">إنشاء حساب جديد</button>
<p id="authError"></p>
</div>
</div>


<div class="toast hidden" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js?v=6.0-premium"></script>
</body>
</html>
